<div class="b-settings-two-factor form-horizontal">
	<div class="legend" data-i18n="PLUGIN_2FA/LEGEND_TWO_FACTOR_AUTH"></div>
	<p class="muted" data-bind="visible: appPasswordsNote" data-i18n="PLUGIN_2FA/APP_PASSWORDS_NOTE"></p>
	<div class="form-horizontal">
		<div class="control-group" data-bind="visible: twoFactorStatus">
			<div class="controls">
				<div style="display: inline-block" data-bind="attr:{title: viewTwoFactorEnableTooltip}">
					<div data-bind="component: {
						name: 'Checkbox',
						params: {
							label: 'PLUGIN_2FA/LABEL_ENABLE_TWO_FACTOR',
							enable: twoFactorAllowedEnable,
							value: viewEnable,
							inline: true
						}
					}"></div>
				</div>
				&nbsp;&nbsp;&nbsp;
				<span class="g-ui-link" data-bind="click: testTwoFactor, visible: twoFactorStatus"
					data-i18n="PLUGIN_2FA/LINK_TEST"></span>
			</div>
		</div>
		<div class="control-group">
			<label class="control-label">
				<span data-i18n="PLUGIN_2FA/LABEL_TWO_FACTOR_USER"></span>
			</label>
			<div class="controls" style="padding-top: 5px;">
				<strong data-bind="text: viewUser"></strong>
			</div>
		</div>
		<div class="control-group" data-bind="visible: '' === viewSecret() && twoFactorStatus() && !clearing()">
			<div class="controls" style="padding-top: 5px;">
				<strong data-bind="visible: secreting">...</strong>
				<span class="g-ui-link" data-bind="click: showSecret, visible: !secreting()"
					data-i18n="PLUGIN_2FA/BUTTON_SHOW_SECRET"></span>
			</div>
		</div>
		<div class="control-group" data-bind="visible: '' !== viewSecret()">
			<label class="control-label">
				<span data-i18n="PLUGIN_2FA/LABEL_TWO_FACTOR_SECRET"></span>
			</label>
			<div class="controls" style="padding-top: 5px;">
				<strong data-bind="text: viewSecret" style="user-select:text"></strong>
				&nbsp;&nbsp;
				<span class="g-ui-link" data-bind="click: hideSecret" data-i18n="PLUGIN_2FA/BUTTON_HIDE_SECRET"></span>
				<br />
				<br />
				<blockquote>
					<p class="muted width100-on-mobile" style="width: 550px" data-i18n="PLUGIN_2FA/TWO_FACTOR_SECRET_DESC"></p>
				</blockquote>
				<img data-bind="attr: {src: viewQRCode}, visible: viewQRCode" alt="QR code" width="240" height="240"
					style="display:block;width:240px;height:240px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:4px">
			</div>
		</div>
		<div class="control-group" data-bind="visible: '' !== viewBackupCodes()">
			<label class="control-label">
				<span data-i18n="PLUGIN_2FA/LABEL_TWO_FACTOR_BACKUP_CODES"></span>
			</label>
			<div class="controls" style="padding-top: 5px;">
				<pre data-bind="text: viewBackupCodes" style="user-select: text; width: 230px; word-break: break-word;"></pre>
				<br />
				<blockquote>
					<p class="muted width100-on-mobile" style="width: 550px" data-i18n="PLUGIN_2FA/TWO_FACTOR_BACKUP_CODES_DESC"></p>
				</blockquote>
			</div>
		</div>
	</div>

	<a class="btn btn-danger" data-bind="click: clearTwoFactor, visible: twoFactorStatus">
		<i class="fontastic" data-bind="css: {'icon-spinner': clearing()}">✖</i>
		<span data-i18n="GLOBAL/CLEAR"></span>
	</a>
	<a class="btn" data-bind="click: createTwoFactor, visible: !twoFactorStatus()">
		<i class="fontastic" data-bind="css: {'icon-spinner': processing()}">▶</i>
		<span data-i18n="PLUGIN_2FA/BUTTON_ACTIVATE"></span>
	</a>

	<!-- 2.28.0: security keys and passkeys, a second factor next to the code. -->
	<div class="b-settings-two-factor-keys" data-bind="visible: webauthn">
		<div class="legend" data-i18n="PLUGIN_2FA/LEGEND_PASSKEYS"></div>
		<p class="muted" data-i18n="PLUGIN_2FA/PASSKEYS_DESC"></p>
		<p class="muted" data-bind="visible: !webauthnSupported()" data-i18n="PLUGIN_2FA/PASSKEYS_UNSUPPORTED"></p>
		<table class="table table-hover" data-bind="visible: hasPasskeys">
			<thead>
				<tr>
					<th data-i18n="PLUGIN_2FA/LABEL_PASSKEY_NAME"></th>
					<th data-i18n="PLUGIN_2FA/LABEL_PASSKEY_CREATED"></th>
					<th data-i18n="PLUGIN_2FA/LABEL_PASSKEY_LAST_USED"></th>
					<th></th>
				</tr>
			</thead>
			<tbody data-bind="foreach: passkeys">
				<tr class="twofactor-passkey">
					<td>
						<span dir="auto" style="unicode-bidi: plaintext" data-bind="text: name, visible: !editing()"></span>
						<input type="text" class="uiInput" maxlength="64" dir="auto" style="unicode-bidi: plaintext"
							data-bind="textInput: draft, visible: editing, onEnter: $parent.savePasskey">
					</td>
					<td style="unicode-bidi: plaintext" data-bind="text: created"></td>
					<td style="unicode-bidi: plaintext" data-bind="text: lastUsed"></td>
					<td style="white-space: nowrap">
						<span class="g-ui-link" data-bind="click: $parent.renamePasskey, visible: !editing()" data-i18n="PLUGIN_2FA/LINK_RENAME"></span>
						<span class="g-ui-link" data-bind="click: $parent.savePasskey, visible: editing" data-i18n="PLUGIN_2FA/LINK_SAVE"></span>
						&nbsp;
						<span class="g-ui-link" data-bind="click: $parent.removePasskey" data-i18n="PLUGIN_2FA/LINK_REMOVE"></span>
					</td>
				</tr>
			</tbody>
		</table>
		<div class="control-group" data-bind="visible: canAddPasskey">
			<input type="text" class="uiInput" maxlength="64" dir="auto" style="unicode-bidi: plaintext"
				data-bind="textInput: newPasskeyName, disable: passkeyBusy" data-i18n="[placeholder]PLUGIN_2FA/PLACEHOLDER_PASSKEY_NAME">
			<a class="btn twofactor-add-passkey" data-bind="click: addPasskey, css: {disabled: passkeyBusy}">
				<i class="fontastic" data-bind="css: {'icon-spinner': passkeyBusy()}">🔑</i>
				<span data-i18n="PLUGIN_2FA/BUTTON_ADD_PASSKEY"></span>
			</a>
		</div>
		<p class="muted" data-bind="visible: webauthn() && !canAddPasskey() && hasPasskeys()" data-i18n="PLUGIN_2FA/PASSKEYS_MAX"></p>
		<div class="alert" data-bind="visible: passkeyError, text: passkeyError"></div>
	</div>
<!--
	<a class="btn" data-bind="click: close, visible: viewEnable()">
		<i class="icon-ok" ></i>
		<span data-i18n="GLOBAL/DONE"></span>
	</a>
-->
</div>
